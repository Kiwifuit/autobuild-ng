name: Build & Release code

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            artifact: autobuild-ng.x86
            bin: autobuild-ng
            packages: ''
            runner: ubuntu-latest

          - target: armv7-unknown-linux-gnueabihf
            artifact: autobuild-ng.armv7
            bin: autobuild-ng
            packages: crossbuild-essential-armhf
            runner: ubuntu-latest

          - target: aarch64-unknown-linux-gnu
            artifact: autobuild-ng.aarch64
            bin: autobuild-ng
            packages: crossbuild-essential-arm64
            runner: ubuntu-latest

          - target: x86_74-pc-windows-msvc
            artifact: autobuild-ng-amd64.exe
            bin: autobuild-ng.exe
            packages:
            runner: windows-latest

    name: Build project
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt update && sudo apt install ${{ matrix.platform.packages }}
        if: ${{ matrix.platform.packages != '' && matrix.platform.runner == 'ubuntu-latest'}}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build binary
        run: |
          cargo build --release --target ${{ matrix.platform.target }}
          mv target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}  ${{ matrix.platform.artifact }}

      - name: Build deb package
        run: cargo deb --target ${{ matrix.platform.target }}
        if: contains(${{ matrix.platform.target }}, 'linux')

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin.${{ matrix.platform.target }}
          path: ${{ matrix.platform.artifact }}

      - name: Upload deb artifact
        uses: cloudsmith-io/action@7af394e0f8add4867bce109385962dafecad1b8d
        if: contains(${{ matrix.platform.target }}, 'linux')
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: deb
          owner: inhumane
          repo: miscellaneous
          republish: "true"
          distro: debian
          release: trixie
          file: target/${{ matrix.platform.target }}/debian/*.deb

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir dist
          mv artifacts/*/* dist/

          ls -la dist/

      - name: Create Changelog
        uses: requarks/changelog-action@v1
        id: changelog
        with:
          token: ${{ github.token }}
          # fromTag: ${{ env.previous_tag }}
          # toTag: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          writeToFile: false
          reverseOrder: true
          # excludeTypes: docs,chore

      - name: Create release
        uses: softprops/action-gh-release@v2.4.1
        with:
          name: "AutoBuild ${{ github.ref_name }}"
          body: ${{ steps.changelog.output.changes }}
          files: |
            dist/*
          generate_release_notes: true
          append_body: true
          make_latest: true
